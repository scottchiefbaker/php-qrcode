name: tests

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gd
          coverage: none

      - name: Install qrencode
        run: sudo apt-get update && sudo apt-get install -y qrencode

      - name: Lint
        run: |
          php -l qrcode.php
          php -l unit_tests/tests.php

      - name: Run tests
        run: php unit_tests/tests.php

      - name: Run tests without extensions loaded
        run: php -n unit_tests/tests.php
